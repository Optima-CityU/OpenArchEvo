<text class="eq" x="32" y="566.4" style="white-space:pre" xml:space="preserve">S<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> = clip( ⟨γ⟩ · S<tspan dy="3.5" font-size="72%">t-1</tspan><tspan dy="-3.5">​</tspan> + k<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan>ᵀ β<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> (v<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> − k<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> S<tspan dy="3.5" font-size="72%">t-1</tspan><tspan dy="-3.5">​</tspan>), ±10 )      o<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> = q<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> S<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan>      β<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan>, γ<tspan dy="3.5" font-size="72%">t</tspan><tspan dy="-3.5">​</tspan> ∈ {0, 1}</text>
<text class="eq" x="32" y="586.4" style="white-space:pre" xml:space="preserve">code, per 64-token chunk: errors vs. the chunk-start state with a ½-weighted intra-chunk correction; ⟨γ⟩ = fraction of keep spikes in the chunk</text>
